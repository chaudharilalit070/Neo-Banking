spring:
  datasource:
    url: jdbc:mysql://localhost:3306/customer_db
    username: ${DB_USERNAME:customer_db}
    password: ${DB_PASSWORD:Root@07}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.company.neobanking.customer: DEBUG