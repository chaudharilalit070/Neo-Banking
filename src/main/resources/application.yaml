spring:
  application:
    name: customer-service

  profiles:
    default: local

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: customer-service
    description: Neo Banking Customer Management Service
    version: 1.0.0