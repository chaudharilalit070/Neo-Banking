
  datasource:
    url: jdbc:mysql://localhost:3306/neobank
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  logging:
    level:
      root: INFO
      com.neobank: DEBUG
      hibernate:
        format_sql: true

server:
  port: 8080